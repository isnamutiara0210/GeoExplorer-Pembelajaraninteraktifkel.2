<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GeoMedia Interaktif - Geografi Fase E & F</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #d9f3e8 0%, #f1faf6 52%, #d9eff2 100%);
            color: #173a32;
            min-height: 100vh;
            margin: 0;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Aspect Ratio Container (landscape optimization for Interactive Boards, Laptops, Tablets, & Mobiles) */
        .landscape-wrapper {
            width: 100vw;
            height: 100vh;
            max-width: 1600px;
            max-height: 900px;
            padding: 0.75rem;
            box-sizing: border-box;
            display: flex;
        }

        .landscape-container {
            width: 100%;
            height: 100%;
            background: rgba(249, 255, 252, 0.96);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(150, 195, 176, 0.65);
            border-radius: 1.25rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }

        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #1e293b;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb {
            background: #475569;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #64748b;
        }

        .animate-fade-in {
            animation: fadeIn 0.35s ease-in-out forwards;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Drag and Drop Styling */
        .draggable-item {
            cursor: grab;
            user-select: none;
            touch-action: none;
        }
        .draggable-item:active {
            cursor: grabbing;
        }
        .drop-zone-active {
            border-color: #38bdf8 !important;
            background-color: rgba(56, 189, 248, 0.15) !important;
        }

        #app-content.slide-cover {
            background-image: linear-gradient(135deg, rgba(15, 23, 42, 0.68), rgba(15, 23, 42, 0.35)), url("assets/cover.png");
            background-position: center;
            background-repeat: no-repeat;
            background-size: cover;
        }

        #app-content.slide-background {
            background-image: linear-gradient(rgba(241, 250, 246, 0.3), rgba(241, 250, 246, 0.3)), url("assets/background.png");
            background-position: center;
            background-repeat: no-repeat;
            background-size: cover;
        }

        header,
        footer {
            background-color: #e4f4ec !important;
            border-color: #b9d8c8 !important;
        }

        header [class*="bg-slate-"],
        footer [class*="bg-slate-"] {
            background-color: #ffffff !important;
        }

        header [class*="text-slate-"],
        footer [class*="text-slate-"] {
            color: #526d64 !important;
        }

        #app-content:not(.slide-cover) {
            background-color: #f1faf6;
            color: #21443a;
        }

        #app-content:not(.slide-cover) [class*="bg-slate-"] {
            background-color: #ffffff !important;
        }

        #app-content:not(.slide-cover) [class*="hover:bg-slate-"]:hover {
            background-color: #e3f2eb !important;
        }

        #app-content:not(.slide-cover) [class*="border-slate-"] {
            border-color: #c9dfd4 !important;
        }

        #app-content:not(.slide-cover) [class*="text-slate-100"],
        #app-content:not(.slide-cover) [class*="text-slate-200"],
        #app-content:not(.slide-cover) [class*="text-slate-300"] {
            color: #35564c !important;
        }

        #app-content:not(.slide-cover) [class*="text-slate-400"],
        #app-content:not(.slide-cover) [class*="text-slate-500"] {
            color: #617b72 !important;
        }

        #app-content:not(.slide-cover) :not(button).text-white {
            color: #173a32 !important;
        }

        #app-content:not(.slide-cover) input::placeholder {
            color: #718b82 !important;
        }

        #app-content:not(.slide-cover) [class*="text-emerald-"] {
            color: #087f5b !important;
        }

        #app-content:not(.slide-cover) [class*="text-teal-"] {
            color: #0f766e !important;
        }

        #app-content:not(.slide-cover) [class*="text-cyan-"] {
            color: #0e7490 !important;
        }

        #app-content:not(.slide-cover) [class*="text-sky-"] {
            color: #0369a1 !important;
        }

        #app-content:not(.slide-cover) [class*="text-blue-"] {
            color: #1d4ed8 !important;
        }

        #app-content:not(.slide-cover) [class*="text-amber-"] {
            color: #a16207 !important;
        }

        #app-content:not(.slide-cover) [class*="text-purple-"] {
            color: #7e22ce !important;
        }

        #app-content:not(.slide-cover) [class*="text-red-"] {
            color: #b91c1c !important;
        }

        #modal-container > div {
            background-color: #ffffff;
            border-color: #c9dfd4;
        }

        #modal-title {
            color: #173a32;
        }

        #modal-message {
            color: #526d64;
        }

        .title-image-zoom {
            width: min(100%, 900px);
            max-height: 58vh;
            object-fit: contain;
            transform-origin: center;
            animation: titleImageZoom 4s ease-in-out infinite;
        }

        @keyframes titleImageZoom {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.04); }
        }

        @media (prefers-reduced-motion: reduce) {
            .title-image-zoom {
                animation: none;
            }
        }
    </style>
</head>
<body>

    <div class="landscape-wrapper">
        <div class="landscape-container">
            
            <!-- TOP NAVIGATION / HEADER BAR -->
            <header class="bg-slate-800/90 border-b border-slate-700/80 px-4 sm:px-6 py-3 flex items-center justify-between shrink-0">
                <div class="flex items-center space-x-3">
                    <div class="w-9 h-9 sm:w-10 sm:h-10 rounded-xl bg-gradient-to-tr from-emerald-500 to-teal-400 flex items-center justify-center shadow-lg shadow-emerald-500/20">
                        <i class="fa-solid fa-earth-asia text-white text-base sm:text-lg"></i>
                    </div>
                    <div>
                        <h1 class="font-bold text-base sm:text-lg tracking-wide bg-gradient-to-r from-emerald-400 to-teal-300 bg-clip-text text-transparent">GeoMedia Interaktif</h1>
                        <p class="text-[10px] sm:text-xs text-slate-400">Kurikulum Merdeka • SMA Kelas X & XI (Fase E & F)</p>
                    </div>
                </div>
                
                <div id="user-badge" class="hidden items-center space-x-3 bg-slate-900/80 px-3 py-1.5 rounded-xl border border-slate-700">
                    <div class="w-7 h-7 rounded-full bg-emerald-500/20 text-emerald-400 flex items-center justify-center font-bold text-xs">
                        <i class="fa-solid fa-user-graduate"></i>
                    </div>
                    <div class="text-[11px] leading-tight">
                        <p id="badge-name" class="font-semibold text-slate-200">-</p>
                        <p id="badge-class" class="text-slate-400 text-[10px]">-</p>
                    </div>
                    <button onclick="goToSlide(3)" class="text-[11px] bg-slate-700 hover:bg-slate-600 px-2.5 py-1 rounded-lg text-slate-200 transition">
                        <i class="fa-solid fa-bars mr-1"></i> Menu
                    </button>
                </div>
            </header>

            <!-- MAIN APP CONTENT AREA -->
            <main id="app-content" class="flex-1 flex flex-col p-4 sm:p-6 overflow-y-auto relative">
                <!-- Dynamic Slide Content Inserted Here via JavaScript -->
            </main>

            <!-- FOOTER -->
            <footer class="bg-slate-800/50 border-t border-slate-700/60 px-4 sm:px-6 py-2 text-center text-[11px] text-slate-400 shrink-0 flex justify-between items-center">
                <p>© Media Pembelajaran Interaktif Geografi SMA • Adaptif Multi-Perangkat</p>
                <p id="footer-status" class="text-emerald-400 font-medium hidden sm:block">Status: Aktif</p>
            </footer>
        </div>
    </div>

    <!-- CUSTOM NOTIFICATION MODAL -->
    <div id="modal-container" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-slate-800 border border-slate-700 rounded-2xl max-w-md w-full p-6 shadow-2xl animate-fade-in text-center">
            <div id="modal-icon" class="w-14 h-14 rounded-full bg-emerald-500/20 text-emerald-400 flex items-center justify-center text-2xl mx-auto mb-3">
                <i class="fa-solid fa-circle-check"></i>
            </div>
            <h3 id="modal-title" class="text-lg font-bold text-white mb-2">Informasi</h3>
            <div id="modal-message" class="text-slate-300 text-xs sm:text-sm mb-5 leading-relaxed">Pesan notifikasi.</div>
            <button onclick="closeModal()" class="w-full bg-gradient-to-r from-emerald-500 to-teal-500 hover:from-emerald-600 hover:to-teal-600 text-white font-semibold py-2.5 rounded-xl transition text-xs sm:text-sm shadow-lg shadow-emerald-500/20">
                Mengerti / Lanjutkan
            </button>
        </div>
    </div>

    <!-- JAVASCRIPT LOGIC -->
    <script>
        // Global State Management
        let state = {
            currentSlide: 1,
            navigationHistory: [],
            student: {
                name: "",
                kelas: "",
                sekolah: ""
            },
            scores: {
                sub1: 0,
                sub2: 0,
                sub3: 0,
                final: 0
            }
        };

        // Utility: Fisher-Yates Shuffle Function for Randomization
        function shuffleArray(array) {
            let shuffled = [...array];
            for (let i = shuffled.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
            }
            return shuffled;
        }

        // Slide 1: Title & Subject Identity Screen
        function renderSlide1() {
            document.getElementById('user-badge').classList.add('hidden');
            document.getElementById('app-content').classList.add('slide-cover');
            document.getElementById('app-content').classList.remove('slide-background');
            const html = `
                <div class="my-auto text-center w-full max-w-5xl mx-auto py-6 animate-fade-in flex flex-col items-center">
                    <img src="assets/judul.png" alt="Media Pembelajaran Digital Interaktif Geografi: Eksplorasi Konsep Geografi, Atmosfer, dan Interaksi Keruangan Desa-Kota untuk SMA Kelas X dan XI" class="title-image-zoom mb-8">
                    <div class="w-full flex justify-center">
                        <button onclick="goToSlide(2)" class="group bg-gradient-to-r from-emerald-500 to-teal-500 hover:from-emerald-600 hover:to-teal-600 text-white font-bold px-6 py-3 rounded-xl shadow-xl shadow-emerald-500/25 transition transform hover:-translate-y-0.5 flex items-center justify-center space-x-3 text-sm sm:text-base">
                            <span>Mulai</span>
                            <i class="fa-solid fa-arrow-right group-hover:translate-x-1 transition"></i>
                        </button>
                    </div>
                </div>
            `;
            document.getElementById('app-content').innerHTML = html;
        }

        // Slide 2: Student Identity Input
        function renderSlide2() {
            document.getElementById('user-badge').classList.add('hidden');
            document.getElementById('app-content').classList.remove('slide-cover');
            document.getElementById('app-content').classList.add('slide-background');
            const html = `
                <div class="max-w-md mx-auto my-auto w-full bg-slate-800/90 border border-slate-700/80 p-6 sm:p-8 rounded-3xl shadow-2xl animate-fade-in">
                    <div class="text-center mb-5">
                        <div class="w-12 h-12 bg-emerald-500/20 text-emerald-400 rounded-2xl flex items-center justify-center mx-auto mb-2 text-xl">
                            <i class="fa-solid fa-id-card"></i>
                        </div>
                        <h3 class="text-xl font-bold text-white">Identitas Murid</h3>
                        <p class="text-slate-400 text-xs mt-1">Lengkapi data Anda untuk pencetakan sertifikat hasil belajar.</p>
                    </div>
                    
                    <form id="identity-form" onsubmit="handleIdentitySubmit(event)" class="space-y-4 text-left">
                        <div>
                            <label class="block text-[11px] font-semibold uppercase tracking-wider text-slate-300 mb-1">Nama Lengkap</label>
                            <input type="text" id="input-name" required value="${state.student.name}" placeholder="Contoh: Ahmad Rizky" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3.5 py-2.5 text-xs sm:text-sm text-white placeholder-slate-500 focus:outline-none focus:border-emerald-500 transition">
                        </div>
                        <div>
                            <label class="block text-[11px] font-semibold uppercase tracking-wider text-slate-300 mb-1">Kelas</label>
                            <input type="text" id="input-class" required value="${state.student.kelas}" placeholder="Contoh: XI IPS 1 / Fase F" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3.5 py-2.5 text-xs sm:text-sm text-white placeholder-slate-500 focus:outline-none focus:border-emerald-500 transition">
                        </div>
                        <div>
                            <label class="block text-[11px] font-semibold uppercase tracking-wider text-slate-300 mb-1">Asal Sekolah</label>
                            <input type="text" id="input-school" required value="${state.student.sekolah}" placeholder="Contoh: SMAN 1 Jakarta" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3.5 py-2.5 text-xs sm:text-sm text-white placeholder-slate-500 focus:outline-none focus:border-emerald-500 transition">
                        </div>
                        <div class="pt-3 flex space-x-3">
                            <button type="button" onclick="goToSlide(1)" class="w-1/3 bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white font-semibold py-2.5 rounded-xl transition text-xs shadow-lg shadow-blue-500/20">
                                <i class="fa-solid fa-arrow-left mr-1"></i> Kembali
                            </button>
                            <button type="submit" class="w-2/3 bg-gradient-to-r from-emerald-500 to-teal-500 hover:from-emerald-600 hover:to-teal-600 text-white font-semibold py-2.5 rounded-xl transition text-xs shadow-lg shadow-emerald-500/20">
                                Lanjut ke Menu Utama <i class="fa-solid fa-arrow-right ml-1"></i>
                            </button>
                        </div>
                    </form>
                </div>
            `;
            document.getElementById('app-content').innerHTML = html;
        }

        function handleIdentitySubmit(e) {
            e.preventDefault();
            state.student.name = document.getElementById('input-name').value.trim();
            state.student.kelas = document.getElementById('input-class').value.trim();
            state.student.sekolah = document.getElementById('input-school').value.trim();
            
            document.getElementById('badge-name').innerText = state.student.name;
            document.getElementById('badge-class').innerText = `${state.student.kelas} • ${state.student.sekolah}`;
            document.getElementById('user-badge').classList.remove('hidden');
            document.getElementById('user-badge').classList.add('flex');

            goToSlide(3);
        }

        // Slide 3: Main Menu
        function renderSlide3() {
            const html = `
                <div class="my-auto animate-fade-in max-w-5xl mx-auto w-full">
                    <div class="text-center mb-6">
                        <h2 class="text-2xl font-extrabold text-white">Menu Utama Pembelajaran</h2>
                        <p class="text-slate-400 text-xs mt-1">Pilih modul pembelajaran, kuis interaktif, atau evaluasi akhir berikut.</p>
                    </div>

                    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
                        <!-- Tombol 1 -->
                        <div onclick="goToSlide('petunjuk')" class="bg-slate-800/80 hover:bg-slate-800 border border-slate-700 hover:border-blue-500/50 p-5 rounded-2xl cursor-pointer transition transform hover:-translate-y-1 shadow-lg group">
                            <div class="w-10 h-10 bg-blue-500/20 text-blue-400 rounded-xl flex items-center justify-center text-lg mb-3 group-hover:scale-110 transition">
                                <i class="fa-solid fa-book-open-reader"></i>
                            </div>
                            <span class="text-[10px] font-semibold text-blue-400 uppercase tracking-wider">Informasi Awal</span>
                            <h3 class="text-base font-bold text-white mt-1 mb-1.5">1. Petunjuk & CP/Tujuan</h3>
                            <p class="text-slate-400 text-xs leading-relaxed">Panduan media, Capaian Pembelajaran (CP), dan Target Pembelajaran Fase E/F.</p>
                        </div>

                        <!-- Tombol 2 -->
                        <div onclick="goToSlide('subbab1_materi')" class="bg-slate-800/80 hover:bg-slate-800 border border-slate-700 hover:border-emerald-500/50 p-5 rounded-2xl cursor-pointer transition transform hover:-translate-y-1 shadow-lg group">
                            <div class="w-10 h-10 bg-emerald-500/20 text-emerald-400 rounded-xl flex items-center justify-center text-lg mb-3 group-hover:scale-110 transition">
                                <i class="fa-solid fa-globe"></i>
                            </div>
                            <span class="text-[10px] font-semibold text-emerald-400 uppercase tracking-wider">Sub-Bab 1 • Fase E</span>
                            <h3 class="text-base font-bold text-white mt-1 mb-1.5">2. Konsep Dasar Geografi</h3>
                            <p class="text-slate-400 text-xs leading-relaxed">Materi 10 Konsep Geografi beserta contohnya & 10 Soal Pilihan Ganda.</p>
                        </div>

                        <!-- Tombol 3 -->
                        <div onclick="goToSlide('subbab2_materi')" class="bg-slate-800/80 hover:bg-slate-800 border border-slate-700 hover:border-sky-500/50 p-5 rounded-2xl cursor-pointer transition transform hover:-translate-y-1 shadow-lg group">
                            <div class="w-10 h-10 bg-sky-500/20 text-sky-400 rounded-xl flex items-center justify-center text-lg mb-3 group-hover:scale-110 transition">
                                <i class="fa-solid fa-cloud-sun"></i>
                            </div>
                            <span class="text-[10px] font-semibold text-sky-400 uppercase tracking-wider">Sub-Bab 2 • Fase F</span>
                            <h3 class="text-base font-bold text-white mt-1 mb-1.5">3. Dinamika Lapisan Atmosfer</h3>
                            <p class="text-slate-400 text-xs leading-relaxed">Materi lapisan udara bumi & Kuis Menjodohkan (5 pasang keterangan).</p>
                        </div>

                        <!-- Tombol 4 -->
                        <div onclick="goToSlide('subbab3_materi')" class="bg-slate-800/80 hover:bg-slate-800 border border-slate-700 hover:border-teal-500/50 p-5 rounded-2xl cursor-pointer transition transform hover:-translate-y-1 shadow-lg group">
                            <div class="w-10 h-10 bg-teal-500/20 text-teal-400 rounded-xl flex items-center justify-center text-lg mb-3 group-hover:scale-110 transition">
                                <i class="fa-solid fa-city"></i>
                            </div>
                            <span class="text-[10px] font-semibold text-teal-400 uppercase tracking-wider">Sub-Bab 3 • Fase F</span>
                            <h3 class="text-base font-bold text-white mt-1 mb-1.5">4. Interaksi Desa dan Kota</h3>
                            <p class="text-slate-400 text-xs leading-relaxed">Materi keruangan wilayah & Game Drag-and-Drop Klasifikasi (10 Keterangan).</p>
                        </div>

                        <!-- Tombol 5 -->
                        <div onclick="goToSlide('latihan_akhir')" class="bg-slate-800/80 hover:bg-slate-800 border border-slate-700 hover:border-amber-500/50 p-5 rounded-2xl cursor-pointer transition transform hover:-translate-y-1 shadow-lg group">
                            <div class="w-10 h-10 bg-amber-500/20 text-amber-400 rounded-xl flex items-center justify-center text-lg mb-3 group-hover:scale-110 transition">
                                <i class="fa-solid fa-file-lines"></i>
                            </div>
                            <span class="text-[10px] font-semibold text-amber-400 uppercase tracking-wider">Evaluasi Akhir</span>
                            <h3 class="text-base font-bold text-white mt-1 mb-1.5">5. Latihan Akhir</h3>
                            <p class="text-slate-400 text-xs leading-relaxed">Evaluasi 15 soal pilihan ganda dari seluruh materi dilengkapi skor & pembahasan.</p>
                        </div>

                        <!-- Tombol 6 -->
                        <div onclick="goToSlide('referensi')" class="bg-slate-800/80 hover:bg-slate-800 border border-slate-700 hover:border-cyan-500/50 p-5 rounded-2xl cursor-pointer transition transform hover:-translate-y-1 shadow-lg group">
                            <div class="w-10 h-10 bg-cyan-500/20 text-cyan-400 rounded-xl flex items-center justify-center text-lg mb-3 group-hover:scale-110 transition">
                                <i class="fa-solid fa-book-bookmark"></i>
                            </div>
                            <span class="text-[10px] font-semibold text-cyan-400 uppercase tracking-wider">Sumber Belajar</span>
                            <h3 class="text-base font-bold text-white mt-1 mb-1.5">6. Sumber/Referensi</h3>
                            <p class="text-slate-400 text-xs leading-relaxed">Daftar sumber pustaka yang digunakan dalam materi pembelajaran.</p>
                        </div>

                        <!-- Tombol 7 -->
                        <div onclick="goToSlide('profil')" class="bg-slate-800/80 hover:bg-slate-800 border border-slate-700 hover:border-purple-500/50 p-5 rounded-2xl cursor-pointer transition transform hover:-translate-y-1 shadow-lg group">
                            <div class="w-10 h-10 bg-purple-500/20 text-purple-400 rounded-xl flex items-center justify-center text-lg mb-3 group-hover:scale-110 transition">
                                <i class="fa-solid fa-user-gear"></i>
                            </div>
                            <span class="text-[10px] font-semibold text-purple-400 uppercase tracking-wider">Informasi Pembuat</span>
                            <h3 class="text-base font-bold text-white mt-1 mb-1.5">7. Profil Pengembang</h3>
                            <p class="text-slate-400 text-xs leading-relaxed">Informasi perancang media interaktif geografi.</p>
                        </div>
                    </div>
                    <div class="flex justify-between items-center gap-3 pt-4">
                        <button onclick="goBack()" class="bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white font-semibold px-4 py-2 rounded-xl text-xs transition shadow-lg shadow-blue-500/20">
                            <i class="fa-solid fa-arrow-left mr-1"></i> Kembali
                        </button>
                        <button onclick="goToSlide('petunjuk')" class="bg-gradient-to-r from-emerald-500 to-teal-500 hover:from-emerald-600 hover:to-teal-600 text-white font-semibold px-5 py-2 rounded-xl text-xs transition shadow-lg shadow-emerald-500/20">
                            Lanjutkan <i class="fa-solid fa-arrow-right ml-1"></i>
                        </button>
                    </div>
                </div>

            document.getElementById('app-content').innerHTML = html;
        }

        // Slide: Petunjuk & CP/Tujuan
        function renderPetunjuk() {
            const html = `
                <div class="max-w-4xl mx-auto w-full my-auto animate-fade-in space-y-5">

        // Router / Navigation Controller
        function goToSlide(target) {
            if (state.currentSlide !== target) {
                state.navigationHistory.push(state.currentSlide);
            }
            renderSlide(target);
        }

        function goBack() {
            const previousSlide = state.navigationHistory.pop();
            if (previousSlide !== undefined) {
                renderSlide(previousSlide);
            }
        }

        function renderSlide(target) {
            state.currentSlide = target;
            const backButton = document.getElementById('back-button');
            if (backButton) {
                backButton.disabled = state.navigationHistory.length === 0;
                backButton.classList.toggle('opacity-50', backButton.disabled);
                backButton.classList.toggle('cursor-not-allowed', backButton.disabled);
            }
            switch (target) {
                case 1:
                    renderSlide1();
                    break;
                case 2:
                    renderSlide2();
                    break;
                case 3:
                    renderSlide3();
                    break;
                case 'petunjuk':
                    renderPetunjuk();
                    break;
                case 'subbab1_materi':
                    renderSubBab1Materi();
                    break;
                case 'subbab1_soal':
                    startSubBab1Soal();
                    break;
                case 'subbab2_materi':
                    renderSubBab2Materi();
                    break;
                case 'subbab2_soal':

                    break;
                case 'subbab3_materi':

                    break;
                case 'subbab3_soal':

                    break;
                case 'latihan_akhir':
                    renderLatihanAkhir();
                    break;
                case 'referensi':
                    renderReferensi();
                    break;
                case 'profil':
                    renderProfil();
                    break;

                    renderSertifikat();

        function selectMatchLayer(id) {
            if (showSub2Discussion) return;
            const previousId = selectedMatchLayerId;
            selectedMatchLayerId = previousId === id ? null : id;
            [previousId, selectedMatchLayerId].filter(Boolean).forEach(layerId => {
                const button = document.querySelector(`[data-match-layer-id="${layerId}"]`);
                if (!button) return;
                const isSelected = Number(layerId) === selectedMatchLayerId;
                button.setAttribute('aria-pressed', String(isSelected));
                button.classList.toggle('border-sky-500', isSelected);
                button.classList.toggle('bg-sky-500/15', isSelected);
                button.classList.toggle('border-slate-700', !isSelected);
                button.classList.toggle('bg-slate-800/80', !isSelected);
            });
            document.querySelectorAll('[data-match-description-id]').forEach(button => {
                button.disabled = selectedMatchLayerId === null;
            });
        }

        function selectMatchDescription(id) {
            if (showSub2Discussion || selectedMatchLayerId === null) return;
            const selectedDescription = matchingPairsMaster.find(item => item.id === id);
            if (!selectedDescription) return;

            const targetLayerId = selectedMatchLayerId;
            const previousTargetDescription = matchSelections[targetLayerId];
            const previousAssignedLayerId = Object.keys(matchSelections).find(layerId => matchSelections[layerId] === selectedDescription.desc);
            if (previousAssignedLayerId) {
                matchSelections[previousAssignedLayerId] = "";
                document.getElementById(`match-layer-pair-${previousAssignedLayerId}`).textContent = 'Belum dipasangkan';
            }
            matchSelections[targetLayerId] = selectedDescription.desc;
            if (previousTargetDescription && previousTargetDescription !== selectedDescription.desc) {
                const previousTargetItem = matchingPairsMaster.find(item => item.desc === previousTargetDescription);
                if (previousTargetItem) updateMatchDescriptionButton(previousTargetItem.id, null);
            }
            updateMatchDescriptionButton(selectedDescription.id, targetLayerId);
            document.getElementById(`match-layer-pair-${targetLayerId}`).textContent = `Pasangan: ${selectedDescription.desc}`;
            selectedMatchLayerId = null;
            document.querySelectorAll('[data-match-layer-id]').forEach(button => button.setAttribute('aria-pressed', 'false'));
            document.querySelectorAll('[data-match-description-id]').forEach(button => {
                button.disabled = true;
            });
        }

        function updateMatchDescriptionButton(id, layerId) {
            const button = document.querySelector(`[data-match-description-id="${id}"]`);
            const label = document.getElementById(`match-description-pair-${id}`);
            if (!button || !label) return;

            const isAssigned = Boolean(layerId);
            const assignedLayer = matchingPairsMaster.find(item => item.id === Number(layerId));
            button.setAttribute('aria-pressed', String(isAssigned));
            button.classList.toggle('border-emerald-500/50', isAssigned);
            button.classList.toggle('bg-emerald-500/10', isAssigned);
            button.classList.toggle('text-emerald-700', isAssigned);
            button.classList.toggle('border-slate-700', !isAssigned);
            button.classList.toggle('bg-slate-800/80', !isAssigned);
            button.classList.toggle('text-slate-200', !isAssigned);
            label.textContent = assignedLayer ? `Dipasangkan: ${assignedLayer.term}` : '';
        }

            if (!showSub2Discussion) {
                let correct = 0;
                matchingPairsMaster.forEach(item => {
                    if (matchSelections[item.id] === item.desc) correct++;

                let score = Math.round((correct / 5) * 100);
                state.scores.sub2 = score;
                showSub2Discussion = true;

                showModal("Hasil Evaluasi Sub-Bab 2", `Anda berhasil menjodohkan <strong>${correct}</strong> dari 5 lapisan dengan tepat.<br>Skor Sub-Bab 2 Anda: <span class="text-sky-400 font-bold text-xl">${score} / 100</span><br><br><span class="text-xs text-slate-400">Silakan tinjau pembahasan evaluasi di bawah ini.</span>`, () => {

        // Sub-Bab 3 Game Helpers (Drag and Drop / Touch)
        let draggedItemId = null;

        function handleDragStart(e, id) {
            draggedItemId = id;
            e.dataTransfer.setData('text/plain', id);
        }

        function handleDragOver(e) {
            e.preventDefault();
            e.currentTarget.classList.add('drop-zone-active');
        }

        function handleDragLeave(e) {
            e.currentTarget.classList.remove('drop-zone-active');
        }

        function handleDrop(e, category) {
            e.preventDefault();
            e.currentTarget.classList.remove('drop-zone-active');
            const id = e.dataTransfer.getData('text/plain') || draggedItemId;
            if (id) {
                assignGameItem(parseInt(id), category);
            }
        }

        function assignGameItem(id, category) {
            if (showSub3Discussion || !['desa', 'kota'].includes(category)) return;
            const item = gameItemsMaster.find(gameItem => gameItem.id === id);
            const target = document.getElementById(`zone-${category}-items`);
            if (!item || !target) return;

            gameAssignments[id] = category;
            document.getElementById(`drag-item-${id}`)?.remove();
            document.getElementById(`assigned-item-${id}`)?.remove();

            const card = document.createElement('div');
            card.id = `assigned-item-${id}`;
            card.className = `bg-slate-900 border ${category === 'desa' ? 'border-emerald-500/40' : 'border-sky-500/40'} p-2.5 rounded-xl text-xs text-slate-200 flex flex-col gap-1 shadow`;
            card.innerHTML = `
                <div class="flex justify-between items-center gap-2">
                    <span class="leading-snug">${item.text}</span>
                    <button onclick="unassignGameItem(${item.id})" class="text-rose-400 hover:text-rose-300 p-1 shrink-0 text-xs"><i class="fa-solid fa-xmark"></i></button>
                </div>
            `;
            target.appendChild(card);
            updateGameCounts();
        }

        function unassignGameItem(id) {
            if (showSub3Discussion) return;
            delete gameAssignments[id];
            document.getElementById(`assigned-item-${id}`)?.remove();

            const item = gameItemsMaster.find(gameItem => gameItem.id === id);
            const pool = document.getElementById('pool-container');
            if (item && pool) {
                const card = createPoolGameItem(item);
                const itemIndex = gameItems.findIndex(gameItem => gameItem.id === id);
                const nextPoolItem = gameItems.slice(itemIndex + 1).find(gameItem => !gameAssignments[gameItem.id]);
                const nextCard = nextPoolItem ? document.getElementById(`drag-item-${nextPoolItem.id}`) : null;
                pool.insertBefore(card, nextCard);
            }
            updateGameCounts();
        }

        function createPoolGameItem(item) {
            const card = document.createElement('div');
            card.id = `drag-item-${item.id}`;
            card.draggable = true;
            card.className = 'draggable-item bg-slate-900 border border-slate-700 p-2.5 rounded-xl text-xs text-slate-200 flex flex-col gap-1.5 shadow-sm hover:border-teal-500/50 transition';
            card.addEventListener('dragstart', event => handleDragStart(event, item.id));

            const text = document.createElement('span');
            text.className = 'leading-snug';
            text.textContent = item.text;

            card.append(text);
            return card;
        }

        function updateGameCounts() {
            const desaCount = Object.values(gameAssignments).filter(category => category === 'desa').length;
            const kotaCount = Object.values(gameAssignments).filter(category => category === 'kota').length;
            document.getElementById('desa-count').textContent = `${desaCount} / 5`;
            document.getElementById('kota-count').textContent = `${kotaCount} / 5`;

                let correct = 0;
                gameItemsMaster.forEach(item => {

                state.scores.sub3 = score;

                                <p class="grid grid-cols-[5.5rem_1fr] gap-2"><span class="text-slate-400">NIM</span><strong class="text-slate-200">25045111</strong></p>
                                <p class="grid grid-cols-[5.5rem_1fr] gap-2"><span class="text-slate-400">Program Studi</span><strong class="text-slate-200">Pendidikan Geografi</strong></p>
                                <p class="grid grid-cols-[5.5rem_1fr] gap-2"><span class="text-slate-400">Fakultas</span><strong class="text-slate-200">Fakultas Ilmu Sosial</strong></p>
                                <p class="grid grid-cols-[5.5rem_1fr] gap-2"><span class="text-slate-400">Universitas</span><strong class="text-slate-200">Universitas Negeri Padang</strong></p>
                            </div>
                        </article>
                    </div>
                    <div class="flex justify-between items-center gap-3 pt-1">
                        <button onclick="goBack()" class="bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white font-semibold px-4 py-2 rounded-xl text-xs transition shadow-lg shadow-blue-500/20"><i class="fa-solid fa-arrow-left mr-1"></i> Kembali</button>
                        <button onclick="goToSlide(3)" class="bg-gradient-to-r from-emerald-500 to-teal-500 hover:from-emerald-600 hover:to-teal-600 text-white font-semibold px-5 py-2 rounded-xl text-xs transition shadow-lg shadow-emerald-500/20">Lanjutkan ke Menu Utama <i class="fa-solid fa-arrow-right ml-1"></i></button>
                    </div>
                </div>
            `;
            document.getElementById('app-content').innerHTML = html;
        }

        // Slide Terakhir: Sertifikat Digital Hasil Belajar
        function renderSertifikat() {
            const dateStr = new Date().toLocaleDateString('id-ID', { year: 'numeric', month: 'long', day: 'numeric' });
            const passed = state.scores.final >= 75;
            const html = `
                <div class="max-w-3xl mx-auto w-full my-auto animate-fade-in space-y-4">
                    <div class="flex items-center justify-between border-b border-slate-700/80 pb-2">
                        <div>
                            <span class="text-[10px] font-semibold text-emerald-400 uppercase tracking-wider">Hasil Belajar Resmi</span>
                            <h2 class="text-xl font-bold text-white">Sertifikat Kelulusan Geografi</h2>
                        </div>
                    </div>

                    <!-- Sertifikat Kontainer (Akan Dicetak sebagai Gambar) -->
                    <div id="certificate-node" class="relative mx-auto w-full max-w-4xl overflow-hidden rounded-xl border-[8px] border-double border-emerald-600 bg-white px-5 py-8 text-center shadow-2xl sm:px-12 sm:py-10" style="background-image: linear-gradient(rgba(255, 255, 255, 0.28), rgba(255, 255, 255, 0.28)), url('assets/sertifikat 2.png'); background-position: center; background-size: cover;">
                        <div class="pointer-events-none absolute inset-3 rounded-lg border border-emerald-200"></div>
                        <div class="absolute left-0 top-0 h-2 w-full bg-gradient-to-r from-emerald-600 via-yellow-400 to-emerald-600"></div>
                        <div class="relative z-10 flex min-h-[430px] flex-col items-center justify-center">
                            <h3 class="text-3xl font-black uppercase tracking-widest text-emerald-950 sm:text-5xl">SERTIFIKAT</h3>
                            <p class="mt-1 text-xl font-extrabold text-emerald-950 sm:text-2xl">Prestasi Belajar Geografi</p>
                            <p class="mt-5 text-sm text-slate-600">Diberikan kepada:</p>
                            <h4 class="mt-1 border-b-2 border-amber-400 px-5 pb-1 text-2xl font-extrabold text-emerald-800 sm:text-3xl">${state.student.name || 'Nama Siswa'}</h4>
                            <div class="mt-3 space-y-1 text-sm text-slate-700">
                                <p><strong>Kelas:</strong> ${state.student.kelas || '—'}</p>
                                <p><strong>Sekolah:</strong> ${state.student.sekolah || '—'}</p>
                            </div>
                            <p class="mt-4 max-w-xl text-xs leading-relaxed text-slate-600">Telah menyelesaikan evaluasi akhir pembelajaran Geografi SMA Fase E dan F dengan hasil:</p>
                            <p class="mt-2 text-2xl font-extrabold tracking-wide text-emerald-800">SCORE = ${state.scores.final}</p>
                            <p class="mt-2 rounded-full border px-5 py-1.5 text-sm font-extrabold tracking-wider ${passed ? 'border-emerald-300 bg-emerald-100 text-emerald-800' : 'border-rose-300 bg-rose-100 text-rose-800'}">${passed ? 'LOLOS' : 'TIDAK LOLOS'}</p>

                            <div class="mt-auto w-full pt-8 text-center text-xs text-slate-600">
                                <p>Tanggal diberikan</p>
                                <p class="mt-1 font-semibold text-slate-800">${dateStr}</p>
                            </div>
                        </div>
                    </div>

                    <div class="flex justify-between items-center pt-1">
                        <button onclick="goBack()" class="bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white font-semibold px-4 py-2 rounded-xl text-xs transition shadow-lg shadow-blue-500/20"><i class="fa-solid fa-arrow-left mr-1"></i> Kembali</button>
                        <button id="download-certificate-button" onclick="downloadCertificate()" class="bg-gradient-to-r from-emerald-500 to-teal-500 hover:from-emerald-600 hover:to-teal-600 text-white font-bold px-5 py-2 rounded-xl text-xs transition shadow-lg shadow-emerald-500/20 flex items-center space-x-2">
                            <i class="fa-solid fa-download"></i>
                            <span>Cetak Sertifikat</span>
                        </button>
                    </div>
                </div>
            `;
            document.getElementById('app-content').innerHTML = html;
        }

        function downloadCertificate() {
            const button = document.getElementById('download-certificate-button');
            const buttonLabel = button.querySelector('span');

            button.disabled = true;
            buttonLabel.textContent = 'Menyiapkan sertifikat...';

            try {
                const canvas = document.createElement('canvas');
                canvas.width = 1600;
                canvas.height = 1100;
                const context = canvas.getContext('2d');
                if (!context) {
                    throw new Error('Canvas untuk membuat gambar sertifikat tidak tersedia.');
                }

                context.fillStyle = '#f6fbf7';
                context.fillRect(0, 0, canvas.width, canvas.height);

                context.strokeStyle = '#047857';
                context.lineWidth = 24;
                context.strokeRect(24, 24, canvas.width - 48, canvas.height - 48);
                context.strokeStyle = '#d6a83f';
                context.lineWidth = 4;
                context.strokeRect(54, 54, canvas.width - 108, canvas.height - 108);
                context.strokeStyle = '#a7d8c1';
                context.lineWidth = 2;
                context.strokeRect(76, 76, canvas.width - 152, canvas.height - 152);

                const topBand = context.createLinearGradient(0, 24, canvas.width, 24);
                topBand.addColorStop(0, '#047857');
                topBand.addColorStop(0.5, '#facc15');
                topBand.addColorStop(1, '#047857');
                context.fillStyle = topBand;
                context.fillRect(24, 24, canvas.width - 48, 18);

                context.textAlign = 'center';
                context.textBaseline = 'middle';
                context.fillStyle = '#064e3b';
                context.font = '800 88px Arial, sans-serif';
                context.fillText('SERTIFIKAT', canvas.width / 2, 190);
                context.font = '700 42px Arial, sans-serif';
                context.fillText('Prestasi Belajar Geografi', canvas.width / 2, 270);

                context.fillStyle = '#475569';
                context.font = '28px Arial, sans-serif';
                context.fillText('Diberikan kepada:', canvas.width / 2, 390);
                context.fillStyle = '#166534';
                context.font = '700 58px Arial, sans-serif';
                context.fillText(state.student.name || 'Nama Siswa', canvas.width / 2, 475, 1350);
                context.strokeStyle = '#d6a83f';
                context.lineWidth = 4;
                context.beginPath();
                context.moveTo(300, 520);
                context.lineTo(1300, 520);
                context.stroke();

                context.fillStyle = '#334155';
                context.font = '30px Arial, sans-serif';
                context.fillText(`Kelas: ${state.student.kelas || '—'}`, canvas.width / 2, 585);
                context.fillText(`Sekolah: ${state.student.sekolah || '—'}`, canvas.width / 2, 635, 1350);
                context.font = '26px Arial, sans-serif';
                context.fillText('Telah menyelesaikan evaluasi akhir pembelajaran Geografi SMA Fase E dan F dengan hasil:', canvas.width / 2, 720, 1380);

                context.fillStyle = '#166534';
                context.font = '800 52px Arial, sans-serif';
                context.fillText(`SCORE = ${state.scores.final}`, canvas.width / 2, 800);

                const passed = state.scores.final >= 75;
                const status = passed ? 'LOLOS' : 'TIDAK LOLOS';
                context.font = '700 30px Arial, sans-serif';
                const statusWidth = context.measureText(status).width + 100;
                const statusX = (canvas.width - statusWidth) / 2;
                context.fillStyle = passed ? '#dcfce7' : '#ffe4e6';
                context.strokeStyle = passed ? '#86efac' : '#fda4af';
                context.lineWidth = 3;
                context.fillRect(statusX, 850, statusWidth, 62);
                context.strokeRect(statusX, 850, statusWidth, 62);
                context.fillStyle = passed ? '#166534' : '#9f1239';
                context.fillText(status, canvas.width / 2, 881);

                const dateStr = new Date().toLocaleDateString('id-ID', { year: 'numeric', month: 'long', day: 'numeric' });
                context.fillStyle = '#475569';
                context.font = '24px Arial, sans-serif';
                context.fillText('Tanggal diberikan', canvas.width / 2, 970);
                context.fillStyle = '#1e293b';
                context.font = '600 26px Arial, sans-serif';
                context.fillText(dateStr, canvas.width / 2, 1010);

                const pngData = canvas.toDataURL('image/png');
                if (!pngData.startsWith('data:image/png')) {
                    throw new Error('Browser gagal membuat file gambar PNG.');
                }
                const link = document.createElement('a');
                const studentName = state.student.name.trim().replace(/\s+/g, '_').replace(/[^a-zA-Z0-9_-]/g, '') || 'Murid';
                link.download = `Sertifikat_Geografi_${studentName}.png`;
                link.href = pngData;
                link.style.display = 'none';
                document.body.appendChild(link);
                link.click();
                link.remove();
                showModal('Sertifikat berhasil diunduh', 'File sertifikat PNG berhasil dibuat dan diunduh.');
            } catch (error) {
                console.error('Gagal mengunduh sertifikat:', error);
                showModal('Unduhan sertifikat gagal', 'Sertifikat belum dapat diunduh. Periksa koneksi internet, lalu coba lagi.');
            } finally {
                button.disabled = false;
                buttonLabel.textContent = 'Cetak Sertifikat';
            }
        }

        // Modal Utilities
        function showModal(title, msg, callback = null) {
            document.getElementById('modal-title').innerHTML = title;
            document.getElementById('modal-message').innerHTML = msg;
            document.getElementById('modal-container').classList.remove('hidden');
            document.getElementById('modal-container').classList.add('flex');
            window.modalCallback = callback;
        }

        function closeModal() {
            document.getElementById('modal-container').classList.add('hidden');
            document.getElementById('modal-container').classList.remove('flex');
            if (window.modalCallback) {
                window.modalCallback();
                window.modalCallback = null;
            }
        }

        // Initial Load on Window Load
        window.onload = function() {
            renderSlide1();
        };
    </script>
</body>
